name: Validate PR

# `pull_request`, not `pull_request_target`: a pull request from a fork runs here with a
# read-only token and no secrets, so nothing in it can write to this repository.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check which files the pull request changes
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-pr-files.mjs "origin/$BASE_REF" "$PR_AUTHOR"

      - name: Validate project JSON files
        run: npm run validate

      - name: Build site
        run: npm run build
